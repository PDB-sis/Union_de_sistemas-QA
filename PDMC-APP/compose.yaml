name: pdmc
services:
  postgres:
    image: sistemaspdb/pdmc-postgres:2026.10.06
    restart: unless-stopped
    environment:
      POSTGRES_DB: pdmc
      POSTGRES_USER: pdmc_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdmc_owner -d pdmc"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:

secrets:
  postgres_password:
    file: ./.secrets/postgres-password
